services:
  main:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: expmachines-main
    container_name: main
    volumes:
      - .:/app
    command: bash

  notebook:
    image: expmachines-main
    depends_on:
      - main
    container_name: notebook
    volumes:
      - .:/app
    ports:
      - "8888:8888"
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root
